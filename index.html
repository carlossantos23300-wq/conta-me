        '<div class="chips rep"><button class="chip" data-a="edFlag" data-f="round" aria-pressed="' + !!v.round + '">Arredondar os gastos para aqui</button></div>' +
        '<div class="small">O valor mensal entra sozinho no dia 1. Com o arredondamento, um gasto de 3,40 manda 0,60 para este objetivo.</div>';
    } else if (e.kind === 'debt') {
      body = '<h1 class="ask">Quem deve a quem?</h1><div class="chips rep" role="group" aria-label="Sentido">' +
        '<button class="chip" data-a="edSet" data-f="dir" data-v="in" aria-pressed="' + (v.dir === 'in') + '">Devem-me</button>' +
        '<button class="chip" data-a="edSet" data-f="dir" data-v="out" aria-pressed="' + (v.dir === 'out') + '">Eu devo</button></div>' +
        inp('who', 'Quem', v.who, false, 'Nome da pessoa') + inp('amount', 'Quanto', v.amount, true, '12,50') + inp('note', 'De quê (opcional)', v.note, false, 'Jantar de sábado');
    } else if (e.kind === 'check') {
      body = '<h1 class="ask">Que lista é esta?</h1>' + inp('name', 'Nome', v.name, false, 'Manhã, Mala de viagem…') +
        '<div class="chips rep" role="group" aria-label="Tipo de lista">' +
        '<button class="chip" data-a="edSet" data-f="mode" data-v="d" aria-pressed="' + (v.mode !== 'm') + '">Rotina de todos os dias</button>' +
        '<button class="chip" data-a="edSet" data-f="mode" data-v="m" aria-pressed="' + (v.mode === 'm') + '">Para reutilizar</button></div>' +
        '<div class="small">A rotina volta a zero todas as manhãs. A lista para reutilizar só recomeça quando tu disseres.</div>';
    } else if (e.kind === 'wish') {
      body = '<h1 class="ask">O que é que queres comprar?</h1>' + inp('name', 'O quê', v.name, false, 'Uns ténis novos') + inp('price', 'Quanto custa', v.price, true, '90') +
        '<div class="small">Fica aqui a marinar. Se daqui a 30 dias ainda o quiseres, é porque vale a pena.</div>';
    } else if (e.kind === 'list') {
      body = '<h1 class="ask">Como se chama a lista?</h1>' + inp('name', 'Nome', v.name, false, 'Casa, Trabalho, Escola…') +
        (e.id ? '<div class="small">Se a apagares, as tarefas dela ficam sem lista. Não se perdem.</div>' : '');
    } else if (e.kind === 'split') {
      body = '<h1 class="ask">Pagaste tu e querem dividir?</h1>' + inp('total', 'Total da conta', v.total, true, '48') +
        inp('names', 'Com quem (nomes separados por vírgulas)', v.names, false, 'Miguel, Rita, João') + inp('note', 'De quê (opcional)', v.note, false, 'Jantar de sábado') +
        '<div class="say" id="splitinfo" style="color:var(--muted);padding:0 4px">' + splitInfo(v) + '</div>';
    } else if (e.kind === 'proj') {
      body = '<h1 class="ask">Que projeto é este?</h1>' + inp('name', 'Nome', v.name, false, 'Mudar de casa, tirar a carta…') +
        (e.id ? '<div class="small">Se o apagares, as tarefas dele ficam. Só deixam de estar juntas.</div>' : '<div class="small">Depois juntas-lhe as tarefas, uma a uma.</div>');
    } else if (e.kind === 'tpl') {
      body = '<h1 class="ask">Que conjunto queres guardar?</h1>' + inp('name', 'Nome', v.name, false, 'Limpezas de sábado') +
        '<div class="field"><label for="ed_items">Tarefas, uma por linha</label>' +
        '<textarea class="input" id="ed_items" data-f="items" placeholder="Aspirar a sala&#10;Mudar os lençóis&#10;Limpar a casa de banho">' + esc(v.items) + '</textarea></div>';
    } else if (e.kind === 'bill') {
      body = '<h1 class="ask">Que conta é para pagar?</h1>' + inp('name', 'O quê', v.name, false, 'Luz, água, IUC…') + inp('amount', 'Quanto', v.amount, true, '45,90') +
        '<div class="field"><label for="ed_when">Até quando</label><input class="input" id="ed_when" data-f="when" type="date" value="' + esc(v.when) + '"></div>' +
        '<div class="chips rowx rep" role="group" aria-label="Categoria">' + S.cats.map(function (c) {
          return '<button class="chip" data-a="edSet" data-f="cat" data-v="' + esc(c.id) + '" aria-pressed="' + (v.cat === c.id) + '">' + esc(c.label) + '</button>';
        }).join('') + '</div>' +
        '<div class="chips rep"><button class="chip" data-a="edFlag" data-f="rep" aria-pressed="' + !!v.rep + '">Todos os meses</button></div>' +
        '<div class="small">Quando a marcares como paga, entra nos gastos nessa categoria.</div>';
    } else if (e.kind === 'trip') {
      body = '<h1 class="ask">Para onde vais?</h1>' + inp('name', 'Nome', v.name, false, 'Lisboa, Gerês, festival…') +
        '<div class="pair"><div class="field" style="flex:1;min-width:0"><label for="ed_start">Começa</label><input class="input" id="ed_start" data-f="start" type="date" value="' + esc(v.start) + '"></div>' +
        '<div class="field" style="flex:1;min-width:0"><label for="ed_end">Acaba</label><input class="input" id="ed_end" data-f="end" type="date" value="' + esc(v.end) + '"></div></div>' +
        inp('budget', 'Quanto queres gastar no total (opcional)', v.budget, true, '300') +
        '<div class="chips rep"><button class="chip" data-a="edFlag" data-f="inMonth" aria-pressed="' + !!v.inMonth + '">Contar no orçamento do mês</button></div>' +
        '<div class="small">Nesses dias, os gastos que apontares entram sozinhos na viagem. Se não a contares no orçamento do mês, ficam à parte e não estragam as contas do costume.</div>';
    } else if (e.kind === 'date') {
      body = '<h1 class="ask">Que data queres lembrar?</h1>' + inp('name', 'O quê', v.name, false, 'Aniversário da mãe') +
        '<div class="field"><label for="ed_when">Quando (o ano não interessa)</label>' +
        '<input class="input" id="ed_when" data-f="when" type="date" value="' + esc(v.when) + '"></div>' +
        '<div class="small">Volta todos os anos. Aparece no ecrã Hoje uma semana antes.</div>';
    } else {
      body = '<label class="sr" for="ed_text">Nota</label><textarea class="input" id="ed_text" data-f="text" placeholder="Escreve aqui…">' + esc(v.text) + '</textarea>';
    }
    return sheet(e.kind === 'split' ? 'Dividir uma conta' : (e.id ? 'Mudar ' : /^(goal|wish|proj|tpl)$/.test(e.kind) ? 'Novo ' : 'Nova ') + ED[e.kind][1], 'edClose', body +
      '<div class="msg" aria-live="polite" style="color:#FF7A59;min-height:20px">' + esc(e.msg || '') + '</div><div class="grow"></div>' +
      '<div class="pair">' + (e.id ? '<button class="btn danger" data-a="edDel" style="height:58px">Apagar</button>' : '') +
      '<button class="save" data-a="edSave" style="flex:1">Guardar</button></div>');
  }

  function viewGoals() {
    var cards = S.goals.map(function (g) {
      var pct = Math.min(100, Math.round(g.saved / g.target * 100)), done = g.saved >= g.target;
      return '<section class="goal"><div class="gh"><span class="gn">' + esc(g.name) + '</span>' +
        '<button class="x" data-a="edOpen" data-k="goal" data-id="' + esc(g.id) + '" aria-label="Mudar ' + esc(g.name) + '">' + ICON.more + '</button></div>' +
        '<div class="say"><strong>' + money(g.saved) + '</strong> de ' + money(g.target) + ' · ' + pct + '%</div>' +
        (g.auto || S.roundTo === g.id ? '<div class="small">' + [g.auto ? '+' + money(g.auto) + ' todos os meses' : '', S.roundTo === g.id ? 'recebe os arredondamentos' : '']
          .filter(Boolean).join(' · ') + '</div>' : '') +
        '<div class="bar"><i style="width:' + pct + '%;background:' + (done ? '#3DDBA4' : 'var(--lime)') + '"></i></div>' +
        (done ? '<div class="say" style="color:var(--done-text)">Conseguiste. Está cá tudo.</div>' :
          '<div class="chips">' + [500, 1000, 2000, 5000].map(function (v) {
            return '<button class="chip" data-a="goalAdd" data-id="' + esc(g.id) + '" data-v="' + v + '">+' + v / 100 + ' ' + S.cur + '</button>';
          }).join('') + '</div>') + '</section>';
    }).join('') || '<div class="empty">Umas férias, um telemóvel, uma almofada para imprevistos: diz para o que queres poupar.</div>';
    return '<div class="screen"><header class="head"><div class="eyebrow">Um bocadinho de cada vez</div><h1 class="title">Objetivos</h1></header>' +
      '<div class="pad">' + cards + '<button class="btn" data-a="edOpen" data-k="goal">Novo objetivo</button></div></div>' + tabs('gastos');
  }

  // O que sobrou do mês passado: escolher o objetivo que o recebe, ou deixar estar.
  function viewSweep() {
    var lo = leftover();
    if (!lo) return viewHoje();
    var rows = S.goals.filter(function (g) { return g.saved < g.target; }).map(function (g) {
      return '<div class="item mov"><button class="main" data-a="sweepTo" data-id="' + esc(g.id) + '">' + chip('#C6F432', 'target') +
        '<span class="text"><span>' + esc(g.name) + '</span><span class="small">' + money(g.saved) + ' de ' + money(g.target) + '</span></span>' +
        '<span class="amt" style="color:var(--done-text)">+' + money(lo.amount) + '</span></button></div>';
    }).join('');
    return '<div class="screen"><header class="head"><div class="eyebrow">' + lo.name.charAt(0).toUpperCase() + lo.name.slice(1) + ' fechou abaixo do orçamento</div>' +
      '<h1 class="title">Sobraram ' + money(lo.amount) + '</h1></header>' +
      '<div class="pad"><div class="say" style="color:var(--muted)">Escolhe o objetivo que fica com eles. É só uma conta dentro da app: o dinheiro a sério, és tu que o pões de lado.</div>' +
      '<section class="list">' + rows + '</section>' +
      '<button class="btn plain" data-a="sweepTo">Desta vez não</button></div></div>' + tabs('hoje');
  }

  // ---------- organizar o dia ----------
  function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return iso(d); }
  function estText(m) { return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h' + (m % 60 ? pad(m % 60) : ''); }
  function newTask(text, extra) {
    var today = iso(new Date()), wd = new Date().getDay();
    var t = { id: uid(), text: text.slice(0, 200), done: false, at: today, doneAt: '', due: '', rep: '', wd: wd, days: [wd], pri: false, streak: 0, last: '', best: 0, hist: [],
      goal: 0, count: 0, cday: '', list: '', focus: '', steps: [], time: '', est: 0, proj: '', touch: today };
    if (extra) Object.keys(extra).forEach(function (k) { t[k] = extra[k]; });
    S.tasks.unshift(t);
    return t;
  }
  // Adiar: amanhã (t), o próximo sábado (w) ou a próxima segunda (n).
  function snooze(t, k) {
    var wd = new Date().getDay();
    t.due = addDays(k === 't' ? 1 : k === 'w' ? (wd === 6 ? 1 : 6 - wd) : (wd === 0 ? 1 : 8 - wd));
    t.focus = ''; t.touch = iso(new Date());
  }
  // Tarefas sem repetição em que não mexes há mais de duas semanas.
  function staleTasks() {
    var lim = addDays(-14), today = iso(new Date());
    return S.tasks.filter(function (t) { return !t.done && !t.rep && t.list !== 'later' && t.touch <= lim && (!t.due || t.due < today) && t.focus !== today; });
  }
  // O que é mesmo para hoje: sem prazo, ou com prazo até hoje.
  function todayTodo() {
    var today = iso(new Date());
    return todoSorted().filter(function (t) { return !t.due || t.due <= today; });
  }
  function estToday() { return todayTodo().reduce(function (n, t) { return n + t.est; }, 0); }
  function billText(b) {
    var n = daysUntil(b.due);
    return n < 0 ? { text: 'atrasada ' + (n === -1 ? '1 dia' : -n + ' dias'), late: true } :
      { text: (n === 0 ? 'é hoje' : n === 1 ? 'é amanhã' : 'daqui a ' + n + ' dias') + ' · ' + shortDate(b.due), late: false };
  }
  function promptNote(view, icon, strong, rest) {
    return '<button class="note sub" data-a="nav" data-v="' + view + '">' + icSvg(icon, 22) + '<span class="say"><strong>' + strong + '</strong> ' + rest + '</span></button>';
  }
  function muted(text) { return '<div class="say" style="color:var(--muted)">' + text + '</div>'; }

  // De manhã: escolher as três que contam.
  function pickRow(t) {
    var on = t.focus === iso(new Date()), d = dueInfo(t), parts = [];
    if (t.time) parts.push('às ' + t.time);
    if (d) parts.push('<span style="color:' + d.color + '">' + d.text + '</span>');
    if (t.est) parts.push(estText(t.est));
    return '<div class="item"><button class="main" data-a="planPick" data-id="' + esc(t.id) + '" aria-pressed="' + on + '">' +
      (on ? '<span class="ring on">' + icSvg('check', 14) + '</span>' : '<span class="ring"></span>') +
      '<span class="text"><span>' + esc(t.text) + '</span>' + (parts.length ? '<span class="small">' + parts.join(' · ') + '</span>' : '') + '</span></button></div>';
  }
  function viewPlan() {
    var today = iso(new Date()), todo = todoSorted();
    var picked = todo.filter(function (t) { return t.focus === today; });
    var mins = picked.reduce(function (n, t) { return n + t.est; }, 0);
    return '<div class="screen"><header class="head"><div class="eyebrow">Antes de começar · ' + picked.length + ' de 3 escolhidas</div>' +
      '<h1 class="title">O que conta hoje?</h1></header><div class="pad">' +
      muted('Escolhe até três. No ecrã Hoje ficam só essas à vista, até as acabares.' + (mins ? ' São cerca de ' + estText(mins) + '.' : '')) +
      '<section class="list">' + (todo.map(pickRow).join('') || '<div class="empty">Não tens nada por fazer. Dia livre.</div>') + '</section>' +
      '<button class="btn" data-a="planDone">Está planeado</button></div></div>' + tabs('hoje');
  }

  // À noite: o que ficou feito, o que passa para amanhã e a linha do diário.
  function closeLeft() {
    var today = iso(new Date());
    return S.tasks.filter(function (t) { return !t.done && !t.rep && t.list !== 'later' && (t.focus === today || (t.due && t.due <= today)); });
  }
  function viewClose() {
    var today = iso(new Date()), done = S.log.filter(function (x) { return x.date === today; }), left = closeLeft();

  // ---------- hábitos ----------
  // O mês de um hábito: um quadradinho por dia, e quantos dos dias que contavam foram cumpridos.
  function habitMonth(t) {

      if (!future && activeOn(t, d) && (!DATE.test(t.at) || k >= t.at)) { act++; if (on) hit++; }
      cells += '<i' + (on ? ' class="on"' : future ? ' class="fut"' : '') + '></i>';

    return { cells: cells, hit: hit, act: act };
  }

  // ---------- a caixa que percebe o que escreves ----------
  var WDN = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
  var MNN = ['janeiro', 'fevereiro', 'marco', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  // Palavras que denunciam a categoria de um gasto, quando o histórico não ajuda.
  var CATWORDS = {
    comida: 'cafe cafes almoco jantar lanche supermercado continente pingo lidl mercadona auchan aldi intermarche minipreco restaurante pizza hamburguer mcdonalds kfc sushi pastelaria padaria pao talho peixaria frutaria mercearia glovo takeaway snack gelado bolo sandes francesinha bifana tosta eats mcdonald burger starbucks padaria',
    transportes: 'gasolina gasoleo combustivel passe uber bolt taxi metro comboio autocarro portagem portagens estacionamento parque carris oficina inspecao pneus voo viagem galp bp repsol prio cepsa brisa ryanair tap flixbus',
    casa: 'renda luz agua gas internet condominio meo vodafone edp eletricidade ikea limpeza detergente moveis seguro',
    lazer: 'cinema netflix spotify hbo disney jogo jogos bar concerto copo copos cerveja festa livro livros discoteca bilhete bilhetes museu playstation steam prenda',
    saude: 'farmacia medico dentista consulta ginasio analises hospital oculos medicamentos psicologo fisioterapia cabeleireiro barbeiro'
  };
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }
  function capFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function whenF(d) {
    var n = daysUntil(d);
    return n === 0 ? 'hoje' : n === 1 ? 'amanhã' : n === -1 ? 'ontem' : DIAS3[parseDay(d).getDay()] + ', ' + shortDate(d);
  }
  // A categoria mais provável: primeiro o que já fizeste com o mesmo nome, depois as palavras conhecidas.
  function guessCat(text) {
    var k = norm(text), seen = {}, words = k.split(/[^a-z0-9]+/).filter(Boolean), i, id;
    if (k) {
      S.expenses.forEach(function (e) { if (!e.fixed && e.desc && norm(e.desc) === k) seen[e.cat] = (seen[e.cat] || 0) + 1; });
      var top = Object.keys(seen).sort(function (a, b) { return seen[b] - seen[a]; })[0];
      if (top && find(S.cats, top)) return top;
    }
    for (id in CATWORDS) {
      var set = ' ' + CATWORDS[id] + ' ';
      for (i = 0; i < words.length; i++) if (set.indexOf(' ' + words[i] + ' ') >= 0 && find(S.cats, id)) return id;
    }
    for (i = 0; i < S.cats.length; i++) if (words.indexOf(norm(S.cats[i].label)) >= 0) return S.cats[i].id;
    return find(S.cats, 'outro') ? 'outro' : S.cats[0].id;
  }
  // De que dias fala uma pergunta: hoje, esta semana, o mês passado, setembro…
  function periodOf(n) {
    var now = new Date(), today = iso(now), y = now.getFullYear(), mon = (now.getDay() + 6) % 7, r, i;
    if (/\bhoje\b/.test(n)) return { start: today, end: today, label: 'hoje' };
    if (/\bontem\b/.test(n)) return { start: addDays(-1), end: addDays(-1), label: 'ontem' };
    if (/\b(semana passada|ultima semana)\b/.test(n)) return { start: addDays(-mon - 7), end: addDays(-mon - 1), label: 'na semana passada' };
    if (/\besta semana\b/.test(n)) return { start: addDays(-mon), end: today, label: 'esta semana' };
    if (/\b(mes passado|ultimo mes)\b/.test(n)) { r = periodRange(shiftMonth(curKey(), -1)); return { start: r.start, end: r.end, label: 'no mês passado' }; }
    if (/\bano passado\b/.test(n)) return { start: (y - 1) + '-01-01', end: (y - 1) + '-12-31', label: 'no ano passado' };
    if (/\b(este ano|no ano)\b/.test(n)) return { start: y + '-01-01', end: today, label: 'este ano' };
    for (i = 0; i < 12; i++) if (new RegExp('\\b' + MNN[i] + '\\b').test(n)) {
      var yy = i > now.getMonth() ? y - 1 : y;
      return { start: yy + '-' + pad(i + 1) + '-01', end: iso(new Date(yy, i + 1, 0)), label: 'em ' + MESES[i] };
    }
    if (/\b(sempre|no total|ate hoje)\b/.test(n)) return { start: '0000-00-00', end: today, label: 'desde o início' };
    r = periodRange(curKey());
    return { start: r.start, end: r.end, label: 'este mês' };
  }
  function resRow(attrs, chipHtml, title, sub, right) {
    return '<div class="item mov"><button class="main" ' + attrs + '>' + chipHtml + '<span class="text"><span>' + esc(title) + '</span><span class="small">' + sub + '</span></span>' +
      (right ? '<span class="amt">' + right + '</span>' : '') + '</button></div>';
  }
  function expRow(e) {
    var cat = catOf(e.cat);
    return resRow('data-a="editExp" data-id="' + esc(e.id) + '"', catIcon(cat), e.desc || cat.label, 'gasto · ' + when(e.date), money(-e.amount));
  }
  // Perguntas sobre os teus próprios dados, respondidas na hora.
  function answer(n) {
    var isQ = /^(quanto|quantos|quantas|qual|onde|em que)\b/.test(n);
    if (!isQ && !/\?\s*$/.test(n)) return null;
    var p = periodOf(n), list, v, t, c;
    function inP(d) { return d >= p.start && d <= p.end; }
    function A(eyebrow, big, line, rows) { return { kind: 'answer', eyebrow: eyebrow, big: big, line: line || '', rows: rows || '' }; }
    if (/\b(sobra|sobram|resta|restam|posso gastar|tenho para gastar)\b/.test(n)) {
      if (!S.budget) return A('Sem orçamento definido', '—', 'Define-o nas definições e eu digo-te quanto sobra.');
      var spent = sum(monthExpenses(curKey())), left = S.budget - spent, pd = periodDays();
      var perDay = Math.max(0, Math.floor((left - pendingFixed()) / pd.left));
      if (/\b(por dia|hoje)\b/.test(n)) return A('Podes gastar por dia', money(perDay), 'Faltam ' + pd.left + ' dias para o mês fechar e sobram ' + money(left) + '.');
      return left >= 0 ? A('Sobram este mês', money(left), 'De ' + money(S.budget) + '. Dá ' + money(perDay) + ' por dia até ao fim do mês.') :
        A('Passaste o orçamento em', money(-left), 'O orçamento era ' + money(S.budget) + '.');
    }
    if (/\btarefas?\b/.test(n)) {
      if (/\b(falta|faltam|tenho|por fazer|pendentes)\b/.test(n)) { v = todoSorted().length; return A('Por fazer agora', String(v), v === 1 ? 'tarefa à tua espera.' : 'tarefas à tua espera.'); }
      v = S.log.filter(function (x) { return inP(x.date); }).length;
      return A('Tarefas riscadas ' + p.label, String(v), v ? 'Boa. Cada uma conta.' : 'Ainda nenhuma. A primeira é a que custa mais.');
    }
    if (/\bsubscri/.test(n)) { v = subsMonthly(); return A('Subscrições', money(v), 'por mês. Num ano são ' + money(v * 12) + '.'); }

  // ---------- dinheiro da semana ----------

      '<button class="save" data-a="timerToggle" style="flex:1">' + (t.end ? 'Pausar' : 'Começar') + '</button></div></div></div>';

  setInterval(function () {
    var t = ui.timer;
    if (!t || !t.end) return;
    if (t.end - Date.now() <= 0) {
      t.end = 0; t.left = 0; t.done = true;
      blip([660, 880, 1040]); confetti();
      if (ui.view === 'timer' || ui.view === 'hoje') render(true);
      return;
    }
    var c = document.getElementById('clock');
    if (c) c.textContent = clockText(t.end - Date.now());
  }, 500);

  // ---------- fotos dos talões: ficam guardadas à parte, no próprio iPhone ----------
  var idb;
  function photoDb(cb) {
    if (idb) return cb(idb);
    try {
      var rq = indexedDB.open('contame', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('photos'); };
      rq.onsuccess = function () { idb = rq.result; cb(idb); };
      rq.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }
  function photoPut(id, data, cb) {
    photoDb(function (d) {
      if (!d) return cb(false);
      var tx = d.transaction('photos', 'readwrite');
      tx.objectStore('photos').put(data, id);
      tx.oncomplete = function () { cb(true); };
      tx.onerror = function () { cb(false); };
    });
  }
  function photoGet(id, cb) {
    photoDb(function (d) {
      if (!d) return cb('');
      var rq = d.transaction('photos').objectStore('photos').get(id);
      rq.onsuccess = function () { cb(rq.result || ''); };
      rq.onerror = function () { cb(''); };
    });
  }
  function photoDel(id) { photoDb(function (d) { if (d) d.transaction('photos', 'readwrite').objectStore('photos').delete(id); }); }
  // Encolhe a fotografia antes de a guardar, para não encher o telemóvel.
  function shrink(file, cb) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(''); };
    img.src = url;
  }

  // O mês em grelha: quanto saiu em cada dia (mais forte = mais gasto) e um ponto verde nos dias com tarefas feitas.
  function viewCal() {
    var key = ui.calMonth || monthKey(new Date()), p = key.split('-'), y = parseInt(p[0], 10), m = parseInt(p[1], 10);
    var today = iso(new Date()), days = new Date(y, m, 0).getDate(), offset = (new Date(y, m - 1, 1).getDay() + 6) % 7;
    var spent = {}, done = {}, max = 1;
    S.expenses.forEach(function (e) { if (e.date.slice(0, 7) === key) { spent[e.date] = (spent[e.date] || 0) + e.amount; max = Math.max(max, spent[e.date]); } });
    S.log.forEach(function (x) { if (x.date.slice(0, 7) === key) done[x.date] = (done[x.date] || 0) + 1; });
    var sel = ui.calDay || (today.slice(0, 7) === key ? today : '');
    var cells = '';
    for (var i = 0; i < offset; i++) cells += '<span></span>';
    for (var d = 1; d <= days; d++) {
      var ds = key + '-' + pad(d), v = spent[ds] || 0;
      cells += '<button class="cd' + (ds === today ? ' today' : '') + (ds === sel ? ' sel' : '') + '" data-a="calDay" data-d="' + ds + '" style="--h:' + (v ? (0.16 + 0.74 * v / max).toFixed(2) : 0) + '"' +
        ' aria-label="' + d + ' de ' + MESES[m - 1] + (v ? ': ' + money(v) : '') + '"><b>' + d + '</b><span>' + (v ? Math.round(v / 100) : '') + '</span>' + (done[ds] ? '<i></i>' : '') + '</button>';
    }
    var detail = '';
    if (sel) {
      var ex = S.expenses.filter(function (e) { return e.date === sel; }), dn = S.log.filter(function (x) { return x.date === sel; });
      detail = '<section class="wkday"><div class="eyebrow"><b>' + when(sel) + '</b>' + (ex.length ? ' · ' + money(sum(ex)) : '') + '</div>' +
        ex.map(function (e) { var cat = catOf(e.cat); return '<div class="wk"><span class="cdot" style="background:' + cat.color + '"></span><span>' + esc(e.desc || cat.label) + '</span><span class="amt">' + money(-e.amount) + '</span></div>'; }).join('') +
        dn.map(function (x) { return '<div class="wk">' + ICON.done.replace(/"24"/g, '"20"') + '<span>' + esc(x.text) + '</span></div>'; }).join('') +
        (ex.length || dn.length ? '' : '<div class="small" style="padding:2px 2px 6px">nada neste dia</div>') + '</section>';
    }
    return '<div class="screen"><header class="head"><div class="eyebrow">Dia a dia</div><h1 class="title">Calendário</h1></header>' +
      '<div class="pad"><div class="month"><button data-a="calMove" data-by="-1" aria-label="Mês anterior">' + ICON.prev + '</button>' +
      '<div class="h2">' + MESES[m - 1] + ' ' + y + '</div>' +
      '<button data-a="calMove" data-by="1" aria-label="Mês seguinte"' + (key >= today.slice(0, 7) ? ' disabled' : '') + '>' + ICON.next + '</button></div>' +
      '<section class="panel" style="padding:14px"><div class="calg calh" aria-hidden="true">' + DAYS.map(function (x) { return '<span>' + x[1] + '</span>'; }).join('') + '</div>' +
      '<div class="calg">' + cells + '</div></section>' + detail + '</div></div>' + tabs('gastos');
  }

      // Tarefas de contar (8 copos de água): cada toque soma um, e só a última conta como feita.
      if (t.goal > 1) {
        var day0 = iso(new Date());
        if (t.done) t.count = 0;
        else {
          if (t.cday !== day0) { t.count = 0; t.cday = day0; }
          t.count++;
          if (t.count < t.goal) { save(); blip([700]); render(true); return; }
        }
      }
      t.done = !t.done; t.doneAt = t.done ? iso(new Date()) : '';
      if (t.done) logAdd(t.text); else logRemove(t.text);
      if (t.rep) {
        var td = iso(new Date());
        if (t.done) {
          t.streak = (t.streak || 0) + 1; t.last = t.doneAt; t.best = Math.max(t.best || 0, t.streak);
          if (t.hist.indexOf(td) < 0) t.hist.push(td);

      save();
      if (!t.done || !row) { render(true); return; }

      ui.ed.vals[ev.target.dataset.f] = ev.target.value;
      var info = document.getElementById('splitinfo');
      if (info) info.textContent = splitInfo(ui.ed.vals);
    }
    // Procurar: troca só a lista, para o teclado não fechar.
    if (id === 'q') {
      var had = !!ui.q;
      ui.q = ev.target.value.trim();
      if (ui.q) document.getElementById('movs').innerHTML = searchRows();
      else if (had) { render(true); document.getElementById('q').focus(); }
    }
  });

  root.addEventListener('change', function (ev) {
    // Foto do talão: encolhe, guarda à parte e marca o botão.
    if (ev.target.id === 'photoin' && ev.target.files[0] && ui.form) {
      var pf = ui.form;
      shrink(ev.target.files[0], function (data) {
        if (!data) return;
        photoPut(pf.pid, data, function (ok) {
          if (!ok) { alert('Não consegui guardar a fotografia neste telemóvel.'); return; }
          pf.photo = true;
          if (ui.form === pf) render(true);
        });
      });
    }
    if (ev.target.id === 'uname') { S.name = ev.target.value.trim().slice(0, 20); save(); }
    if (ev.target.id === 'wage') { S.wage = parseMoney(ev.target.value); save(); }
    if (ev.target.id === 'cycle') { S.cycle = Math.min(28, Math.max(1, parseInt(ev.target.value, 10) || 1)); ui.month = curKey(); save(); }
    if (ev.target.id === 'chal') {
      S.challenge = Math.min(31, Math.max(0, parseInt(ev.target.value, 10) || 0));
      S.chalFrom = S.challenge ? iso(new Date()) : '';
      save();
    }
    if (ev.target.id === 'budget') {
      var v = parseFloat(ev.target.value.replace(/\s/g, '').replace(',', '.'));
      S.budget = isFinite(v) && v > 0 ? Math.round(v * 100) : 0;
      save(); render(true);
    }
    if (ev.target.id === 'file' && ev.target.files[0]) {
      var reader = new FileReader();
      reader.onload = function () {
        var data;
        try { data = JSON.parse(reader.result); } catch (e) { data = null; }
        if (!data || !Array.isArray(data.expenses) || !Array.isArray(data.tasks)) {
          alert('Este ficheiro não parece ter dados do conta-me.');
          return;
        }
        if (confirm('Repor este ficheiro substitui o que tens agora na app. Continuar?')) {
          S = clean(data); S.bkp = iso(new Date()); save(); applyFixed(); applyIncomes(); rollTasks(); ui.view = 'hoje'; render();
        }
      };
      reader.readAsText(ev.target.files[0]);
    }
    // Extrato do banco: muitos vêm em Windows-1252 e não em UTF-8, por isso tenta um e depois o outro.
    if (ev.target.id === 'bankfile' && ev.target.files[0]) {
      var br = new FileReader();
      br.onload = function () {
        var buf = new Uint8Array(br.result), text;
        if (buf[0] === 0xFF && buf[1] === 0xFE) text = new TextDecoder('utf-16le').decode(buf);
        else try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('windows-1252').decode(buf); }
        bankLoad(text);
      };
      br.readAsArrayBuffer(ev.target.files[0]);
    }
    if (ev.target.id === 'scanfile' && ev.target.files[0]) scanFile(ev.target.files[0]);
    if (ev.target.id === 'fdate' && ui.form) ui.form.date = ev.target.value;
    if (ev.target.id === 'tdue' && ui.taskForm) ui.taskForm.due = ev.target.value;
    if (ev.target.id === 'ttime' && ui.taskForm) ui.taskForm.time = ev.target.value;
    if (ev.target.id === 'fmonth' && ui.form) ui.form.month = parseInt(ev.target.value, 10) || 1;
  });

  snapDaily();
  applyFixed();
  applyGoals();
  applyIncomes();
  rollTasks();
  // As medalhas que já tinhas ganho antes de existirem entram em silêncio; as seguintes fazem festa.
  checkMedals(true);
  medalsOn = true;
  // Dia a partir do qual se contam os 30 dias do aviso da cópia: o do primeiro gasto, ou hoje.
  if (!S.since) {
    S.since = S.expenses.reduce(function (m, e) { return e.date < m ? e.date : m; }, iso(new Date()));
    if (S.expenses.length || S.tasks.length) save();
  }
  // Pede ao iPhone para não limpar os dados da app por falta de espaço.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  // Abre no ecrã escolhido nas definições.
  if (S.start === 'novo') openForm('novo', 'hoje');
  else { if (S.start) ui.view = S.start; render(); }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
